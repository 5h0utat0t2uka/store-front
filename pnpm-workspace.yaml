packages:
  - "."

skills:
  dirs:
    - .agents/skills

permissions:
  "@shopify/hydrogen":
    skills: true

allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false

blockExoticSubdeps: true

verifyDepsBeforeRun: install

trustPolicy: no-downgrade
trustPolicyExclude:
  - undici-types@6.21.0

minimumReleaseAge: 10080
